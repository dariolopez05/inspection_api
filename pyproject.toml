[project]
name = "car-inspection-api"
version = "0.1.0"
description = "Microservicio B2B para clasificacion binaria de danos en vehiculos."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "numpy>=1.26",
    "tensorflow-cpu>=2.17",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
